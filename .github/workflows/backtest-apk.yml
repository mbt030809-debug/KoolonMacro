name: backtest-apk
on:
  push:
    paths: ['backtest-app/**', '.github/workflows/backtest-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: backtest-app
      - uses: actions/upload-artifact@v4
        with:
          name: BacktestApp-apk
          path: backtest-app/app/build/outputs/apk/debug/app-debug.apk
